<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>De la utilidad al asombro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;1,6..96,500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: un paso por pantalla con barra de progreso fija; iconos pixel art en baldosas cuadradas; eje útil (pizarra) → asombro (oro), verde para el «depende». */
:root{
  --bg:#eef1f5;--card:#ffffff;--ink:#18202e;--muted:#5b6577;--line:#d6dce6;
  --util:#3f6187;--util-soft:#e3ebf4;--wonder:#a06a08;--wonder-soft:#fbf0d9;--dep:#2f7a64;--dep-soft:#dff1ea;
  --ok:#2f7a3e;--bad:#b0402f;--neutral-soft:#f4f6f9;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a;--card:#181e29;--ink:#e8ebf1;--muted:#9ba5b7;--line:#2b3342;
  --util:#8fb0d6;--util-soft:#1c2a3b;--wonder:#e8b955;--wonder-soft:#2d2512;--dep:#6fcfae;--dep-soft:#15302a;
  --ok:#7fd18f;--bad:#f0907e;--neutral-soft:#1f2633;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a;--card:#181e29;--ink:#e8ebf1;--muted:#9ba5b7;--line:#2b3342;
  --util:#8fb0d6;--util-soft:#1c2a3b;--wonder:#e8b955;--wonder-soft:#2d2512;--dep:#6fcfae;--dep-soft:#15302a;
  --ok:#7fd18f;--bad:#f0907e;--neutral-soft:#1f2633;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.12rem;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--wonder);outline-offset:3px;border-radius:6px}
.wrap{max-width:42rem;margin-inline:auto}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.px-xs{width:24px;height:24px}.px-s{width:32px;height:32px}.px-m{width:48px;height:48px}.px-l{width:80px;height:80px}.px-xl{width:144px;height:144px}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:.8rem .7rem;display:grid;gap:.55rem}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.brand{display:flex;align-items:center;gap:.4rem;font-family:var(--display);font-style:italic;font-size:1.05rem;white-space:nowrap;min-width:0}
.brand b{font-style:normal;color:var(--util)} .brand i{color:var(--wonder)}
.right{display:flex;align-items:center;gap:.6rem}
.count{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap}
.snd{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:.3rem .55rem;font-family:var(--mono);font-size:.74rem;white-space:nowrap}
.snd[aria-pressed="false"]{color:var(--muted);border-style:dashed}
.ba{display:none;color:var(--muted)}
@media (max-width:480px){.bt{display:none}.ba{display:inline}.count .mins{display:none}}
.dots{display:flex;gap:5px}
.dots button{flex:1;height:8px;border-radius:4px;border:0;background:var(--line);padding:0}
.dots button.done{background:linear-gradient(90deg,var(--util),var(--wonder))}
.dots button.now{background:var(--ink)}

/* Tarjeta */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.6rem 1.25rem;margin-top:.6rem;min-height:24rem;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:1.1rem;width:100%}
.card>*{min-width:0}
@media (min-width:600px){.card{padding:2rem 2.2rem}}
.card.in-next{animation:inNext .28s steps(6) both}.card.in-back{animation:inBack .28s steps(6) both}
@keyframes inNext{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card.in-next,.card.in-back{animation:none}}
.kicker{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.head{display:flex;align-items:center;gap:.9rem}
.head .px{border-radius:10px}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,8vw,3.2rem)}
h2{font-size:clamp(1.55rem,5.5vw,2.15rem)}
h1 .u,h2 .u{color:var(--util)} h1 .w,h2 .w{color:var(--wonder)} h2 .d{color:var(--dep)}
p{margin:0}
.big{font-size:1.22rem}
.muted{color:var(--muted)}
.hl-u{background:var(--util-soft);color:var(--util);padding:0 .3em;border-radius:4px;font-weight:700}
.hl-w{background:var(--wonder-soft);color:var(--wonder);padding:0 .3em;border-radius:4px;font-weight:700}
.de{font-family:var(--mono);font-size:.82em;color:var(--muted)}
.tip{position:relative;display:block;background:var(--bg);border-radius:12px;padding:.85rem 1rem .85rem 2.1rem;font-size:1.02rem;line-height:1.55}
.tip::before{content:"";position:absolute;left:.95rem;top:1.35rem;width:9px;height:9px;border-radius:50%;background:var(--wonder)}
details{border-top:1px dashed var(--line);padding-top:.8rem}
summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:.98rem;display:flex;align-items:center;gap:.5rem;list-style:none}
summary::-webkit-details-marker{display:none}
details p{margin-top:.6rem;font-size:1rem;color:var(--muted)}

/* Botones */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem 1rem;font-weight:700;font-size:1rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.btn{border:0;border-radius:12px;padding:.8rem 1.3rem;font-weight:700;background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{background:transparent;color:var(--muted);border:2px dashed var(--line);cursor:default}
.btn.wide{width:100%}
.btn:active:not(:disabled),.tile:active .sq,.chip:active{transform:translateY(2px)}
.nav{display:flex;justify-content:space-between;gap:.8rem;margin-top:1rem}
.nav .btn{min-width:8rem}

/* Baldosas con icono */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:.6rem}
.tiles.four{grid-template-columns:repeat(auto-fill,minmax(6.4rem,1fr))}
.tile{display:grid;justify-items:center;align-content:start;gap:.35rem;border:0;background:transparent;padding:0;min-width:0}
.tile .sq{width:100%;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;background:var(--neutral-soft);transition:transform .1s}
.tile .sq .px{width:58%;height:58%}
.tile span{font-size:.9rem;font-weight:700;text-align:center;line-height:1.25;overflow-wrap:anywhere}
.tile[aria-pressed="true"] .sq{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.t-u .sq{background:var(--util-soft)} .t-w .sq{background:var(--wonder-soft)} .t-d .sq{background:var(--dep-soft)}
.tile.mystery .sq{background:var(--neutral-soft)}

/* Respuesta */
.answer{display:flex;gap:.8rem;align-items:flex-start;border-radius:12px;padding:.9rem 1rem;font-size:1.05rem;border-left:5px solid var(--line);background:var(--bg);min-height:3.4rem}
.answer>div{min-width:0}
.answer.u{border-color:var(--util)} .answer.w{border-color:var(--wonder)} .answer.d{border-color:var(--dep)}
.answer.ok{border-color:var(--ok)} .answer.bad{border-color:var(--bad)}

/* Paso 0 */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.pair .pc{border-radius:14px;padding:1rem;display:grid;gap:.5rem;justify-items:start;border:2px solid var(--line);background:var(--card);text-align:left}
.pair .pc[aria-pressed="true"]{border-color:var(--ink)}
.pair .pc .lab{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pair .pc q{font-size:1.05rem;quotes:"«" "»"}
@media (max-width:440px){.pair{grid-template-columns:1fr}}
.why{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.4rem .8rem;align-items:center;background:var(--bg);border-radius:12px;padding:.9rem 1rem}

/* Paso 1 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.side{border-radius:14px;padding:1rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .8rem;align-items:center}
.side .px{grid-row:span 2}
.side.u{background:var(--util-soft)} .side.w{background:var(--wonder-soft)}
.side strong{font-size:1.15rem;line-height:1.2} .side.u strong{color:var(--util)} .side.w strong{color:var(--wonder)}
.side span{font-size:.92rem;color:var(--muted)}
@media (max-width:440px){.duo{grid-template-columns:1fr}}

/* Paso 2 */
.statue-box{display:grid;place-items:center;background:var(--wonder-soft);border-radius:14px;padding:1.2rem}
.statue-box.shake{animation:shake .32s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.statue-box.shake{animation:none}}

/* Paso 4 */
.ladder{display:grid;gap:.45rem}
.rung{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:.45rem .8rem}
.rung b{flex:1}
.rung .n{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.rung[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.rung.s4{border-left:8px solid var(--wonder)}
.rung.s3{border-left:8px solid color-mix(in srgb,var(--wonder) 65%,var(--util))}
.rung.s2{border-left:8px solid color-mix(in srgb,var(--wonder) 35%,var(--util))}
.rung.s1{border-left:8px solid var(--util)}
.rung.s0{border-style:dashed;background:var(--util-soft)}

/* Paso 5 */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.7rem}
.flip{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.9rem;text-align:left;display:grid;gap:.4rem;min-height:9rem;align-content:start}
.flip .fh{display:flex;align-items:center;gap:.6rem}
.flip strong{font-size:1.05rem}
.flip .q{color:var(--muted);font-size:.95rem}
.flip .back{display:grid;gap:.35rem;font-size:.95rem}
.flip.on{border-color:var(--wonder)}
.flip .tag{font-family:var(--mono);font-size:.7rem;color:var(--muted)}

/* Paso 6 */
.hart{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center}
.tower{display:grid;gap:6px}
.floor{display:grid;grid-template-columns:4.6rem 1fr 1fr;gap:.5rem;align-items:center;font-size:.9rem}
.floor .lab{font-weight:700}
.meterbar{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.meterbar i{display:block;height:100%;border-radius:7px}
.f-str i{background:var(--util)} .f-hi i{background:var(--wonder)}
.tower-head{display:grid;grid-template-columns:4.6rem 1fr 1fr;gap:.5rem;font-family:var(--mono);font-size:.68rem;color:var(--muted);line-height:1.2}
@media (max-width:460px){.hart{grid-template-columns:1fr;justify-items:center}.hart .tower{width:100%}}

/* Paso 7 */
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.switch button{border:0;background:transparent;border-radius:11px;padding:.6rem .5rem;font-weight:700;line-height:1.25}
.switch button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.scene{border-radius:14px;padding:1rem;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center}
.scene .px{border-radius:10px}
.scene.u{background:var(--util-soft)} .scene.w{background:var(--wonder-soft)}
.scene ul{margin:0;padding-left:1.1rem;display:grid;gap:.3rem;font-size:1rem}
.scene.u li::marker{color:var(--util)} .scene.w li::marker{color:var(--wonder)}
@media (max-width:440px){.scene{grid-template-columns:1fr;justify-items:center}.scene ul{justify-self:stretch}}
.voices{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:.6rem}
.voice{border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;font-size:.96rem;display:grid;gap:.2rem}
.voice b{font-family:var(--display);font-size:1.1rem}

/* Paso 8 */
.game-card{display:grid;justify-items:center;gap:.5rem;padding:.6rem 0}
.game-card .sq{width:120px;height:120px;border-radius:18px;display:grid;place-items:center;background:var(--neutral-soft);border:2px solid var(--line)}
.game-card .sq.pop{animation:pop .25s steps(3)}
@keyframes pop{from{transform:scale(.85)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.game-card .sq.pop{animation:none}}
.game-item{font-family:var(--display);font-size:clamp(1.4rem,5.5vw,1.9rem);text-align:center;line-height:1.2}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.choices button{border:2px solid var(--line);border-radius:12px;padding:.6rem .4rem;font-weight:700;background:var(--card);display:grid;justify-items:center;gap:.25rem}
.choices .cu{color:var(--util)} .choices .cw{color:var(--wonder)} .choices .cd{color:var(--dep)}
.score{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.8rem;color:var(--muted)}

/* Paso 9 */
.bread{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center}
.bread .sq{width:96px;height:96px;border-radius:16px;display:grid;place-items:center;background:var(--dep-soft)}
input[type=range]{width:100%;accent-color:var(--dep)}
.ticks{display:flex;justify-content:space-between;font-size:.88rem;line-height:1.3;color:var(--muted);gap:.5rem}
.ticks span{flex:1} .ticks span:nth-child(2){text-align:center} .ticks span:last-child{text-align:right}
.axis{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--util),var(--wonder));margin-top:.4rem}
.axis .pin{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--card);border:4px solid var(--ink);transform:translate(-50%,-50%);transition:left .4s steps(5)}
.axis-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-top:.9rem}
@media (prefers-reduced-motion:reduce){.axis .pin{transition:none}}
.critics{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.6rem}
.critic{border-top:3px solid var(--dep);padding-top:.5rem;font-size:.96rem}
.critic b{display:block}

/* Paso 10 */
.recap{display:grid;gap:.5rem;list-style:none;padding:0;margin:0}
.recap li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.7rem;align-items:center;line-height:1.45}
.gloss-def{min-height:3rem}
.sfx-row{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
.sfx-row .chip{font-size:.88rem;padding:.4rem .8rem}
.sources{font-size:.92rem;color:var(--muted);padding-left:1.2rem;display:grid;gap:.2rem}
.final{font-family:var(--display);font-style:italic;color:var(--wonder);font-size:1.3rem}

body{margin:0}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-row">
      <span class="brand"><canvas class="px px-xs" data-px="util"></canvas><span class="bt"><b>Utilidad</b> → <i>asombro</i></span><span class="ba">→</span><canvas class="px px-xs" data-px="asombro"></canvas></span>
      <span class="right"><span class="count" id="count"></span><button class="snd" id="snd" aria-pressed="true">♪ Sonido</button></span>
    </div>
    <div class="dots" id="dots" aria-label="Progreso"></div>
  </div>
  <main class="card" id="stage" aria-live="polite"></main>
</div>

function advance(){play("next");const n=step+1;
  if(n===STEPS.length-1&&!load("terminado",false)){save("terminado",true);setTimeout(()=>play("finish"),120)}else play("levelUp",n);
  go(n,true)}
function go(n,dir){
  const prev=step;step=Math.max(0,Math.min(STEPS.length-1,n));visited.add(step);save("paso2",step);
  const s=STEPS[step];
  stage.innerHTML=s.html+`<div class="nav"><button class="btn ghost" id="prev" ${step===0?"disabled":""}>← Atrás</button><button class="btn" id="next">${step===STEPS.length-1?"Volver al inicio":"Siguiente →"}</button></div>`;
  paintAll(stage);s.init();
  stage.classList.remove("in-next","in-back");void stage.offsetWidth;
  if(dir!==undefined)stage.classList.add((dir??(step>=prev))?"in-next":"in-back");
  $("#prev").onclick=()=>{play("back");go(step-1,false)};
  $("#next").onclick=()=>{if(step===STEPS.length-1){play("pick");go(0,true)}else{advance()}};
  dotsEl.innerHTML="";
  STEPS.forEach((t,i)=>{const b=document.createElement("button");b.className=i===step?"now":(visited.has(i)?"done":"");
    b.setAttribute("aria-label",`Paso ${i+1}: ${t.name}`);if(i===step)b.setAttribute("aria-current","step");
    b.onclick=()=>{if(i===step)return;play(i>step?"next":"back");if(i>step)play("levelUp",i);go(i,i>step)};dotsEl.appendChild(b)});
  countEl.innerHTML=`${step+1}/${STEPS.length}<span class="mins"> · ~${s.min} min</span>`;
  window.scrollTo({top:0});
}
document.addEventListener("keydown",e=>{if(e.target.matches("input,textarea"))return;
  if(e.key==="ArrowRight"&&step<STEPS.length-1){advance()}
  if(e.key==="ArrowLeft"&&step>0){play("back");go(step-1,false)}});
